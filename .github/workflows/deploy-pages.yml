name: Deploy to GitHub Pages

# 推送到 main 时自动构建并发布到 GitHub Pages。
# 也可以手动触发（Actions → Deploy to GitHub Pages → Run workflow）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 只允许一个并发的 Pages 部署；新的推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建（子路径 + hash 路由）
        # 项目站点部署在 https://<用户>.github.io/<仓库名>/，
        # 所以 base 必须带上仓库名；hash 路由保证刷新深链不会 404。
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_HASH_ROUTER: '1'

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
